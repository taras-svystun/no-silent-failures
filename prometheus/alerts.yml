# for: 30s is for the demo. In production use about 5m, so a short blip
# does not wake anyone up.
groups:
  - name: service
    rules:
      - alert: ServiceDown
        expr: up{job="app"} == 0
        for: 30s
        annotations:
          summary: Prometheus cannot scrape the app.

      - alert: DbDown
        # If the app itself is down, db_up is missing, not 0; ServiceDown covers that.
        expr: db_up == 0
        for: 30s
        annotations:
          summary: The app cannot reach Postgres.

      - alert: HighErrorRate
        # No 5xx at all means no series, so no alert: the right answer here.
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[1m]))
            / sum(rate(http_requests_total[1m])) > 0.1
        for: 30s
        annotations:
          summary: "{{ $value | humanizePercentage }} of requests fail with 5xx."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[1m]))) > 0.5
        for: 30s
        annotations:
          summary: "p95 latency is {{ $value | humanizeDuration }}."
