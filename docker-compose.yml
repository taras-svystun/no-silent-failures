services:
  db:
    image: postgres:17
    environment:
      # Local throwaway DB: these are not secrets.
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tasks"]
      interval: 2s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://tasks:tasks@db:5432/tasks
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.34.1
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    secrets:
      - telegram_bot_token
      - telegram_chat_id
    ports:
      # No login, and anyone here could silence alerts: this Mac only.
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:13.2.5
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Login is the default admin/admin, so only this Mac may reach it.
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

# Docker Compose reads these from .env and mounts each as a file in
# /run/secrets/ of the services that list it.
secrets:
  telegram_bot_token:
    environment: TELEGRAM_BOT_TOKEN
  telegram_chat_id:
    environment: TELEGRAM_CHAT_ID
