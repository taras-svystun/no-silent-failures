services:
  db:
    image: postgres:17
    environment:
      # Local throwaway DB: these are not secrets.
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tasks"]
      interval: 2s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://tasks:tasks@db:5432/tasks
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.5
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Login is the default admin/admin, so only this Mac may reach it.
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
